name: CI

on:
  pull_request:
  push:
    branches: [main, tauri-svelte]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: pnpm install --frozen-lockfile
      - name: Type check (svelte-check)
        run: pnpm check
      - name: Frontend build
        run: pnpm build
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data
          # AWS CLI v2 is preinstalled on GitHub runners (curl 7.81's --aws-sigv4 is broken).
          export AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin AWS_DEFAULT_REGION=us-east-1
          for i in $(seq 1 60); do
            if aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket s3m-test 2>/tmp/mb.txt \
              || grep -q BucketAlreadyOwnedByYou /tmp/mb.txt; then echo "bucket ready"; exit 0; fi
            sleep 1
          done
          echo "MinIO bucket creation failed"; cat /tmp/mb.txt; docker logs minio; exit 1
      - name: Rust tests (unit + live MinIO)
        env:
          S3M_IT_ENDPOINT: http://localhost:9000
          S3M_IT_KEY: minioadmin
          S3M_IT_SECRET: minioadmin
          S3M_IT_BUCKET: s3m-test
          S3M_IT_PATH_STYLE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --include-ignored

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}${{ matrix.args && format('-{0}', contains(matrix.args, 'aarch64') && 'arm64' || 'x86_64') || '' }}
          path: src-tauri/target/**/release/bundle/**/*
          if-no-files-found: error
