name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $v = $Matches[1]
          } else {
            $v = "0.0.0-dev"
          }
          echo "VERSION=$v" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path $nsisDir)) {
            $nsisDir = "$env:ProgramFiles\NSIS"
          }
          if (-not (Test-Path $nsisDir)) {
            Write-Error "NSIS kurulum dizini bulunamadi"
          }
          echo "$nsisDir" >> $env:GITHUB_PATH

      - name: Package Windows
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Version $env:VERSION

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            dist/S3MANAGER-*-windows-setup.exe
            dist/S3MANAGER-*-windows-portable.zip

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Package macOS (arm64)
        run: bash scripts/package-macos.sh "$VERSION"

      - name: Upload macOS arm64 assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-assets
          path: dist/S3MANAGER-*-macos-arm64.dmg

  build-macos-x86_64:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pip install -r requirements-macos-x86_64.txt -r requirements-dev.txt

      - name: Package macOS (x86_64)
        run: bash scripts/package-macos.sh "$VERSION"

      - name: Upload macOS x86_64 assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-assets
          path: dist/S3MANAGER-*-macos-x86_64.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y libfuse2 wget

      - name: Package Linux
        run: bash scripts/package-linux.sh "$VERSION"

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            dist/S3MANAGER-*-linux-x86_64.tar.gz
            dist/S3MANAGER-*-linux-x86_64.AppImage

  release:
    needs: [build-windows, build-macos-arm64, build-macos-x86_64, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release files
        run: find release-assets -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          body_path: release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          draft: false
