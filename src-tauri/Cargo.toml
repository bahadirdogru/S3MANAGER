[package]
name = "s3manager"
version = "1.0.0"
description = "S3 compatible storage manager"
authors = ["Bahadır Doğru"]
license = "GPL-3.0-only"
repository = "https://github.com/bahadirdogru/S3MANAGER"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "s3manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
aws-sdk-s3 = "1.122.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
rust-ini = "0.21.3"
mime_guess = "2.0.5"
semver = "1.0.28"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
thiserror = "2.0.21"
futures = "0.3.34"
base64 = "0.23.1"
uuid = { version = "1.29.3", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
