[digitalocean]
spaces_key = your_spaces_key_here
spaces_secret = your_spaces_secret_here
region = nyc3
endpoint = https://nyc3.digitaloceanspaces.com
bucket = your_bucket_name

[upload_metadata]
enabled = true
cache_control =
text_charset = utf-8
inline_extensions = html,htm,css,js,mjs,json,svg,png,jpg,jpeg,gif,webp,ico,pdf,txt,xml
attachment_extensions = zip,gz,tar,bz2,7z,rar,exe,msi,bin,iso

[appearance]
theme = dark
